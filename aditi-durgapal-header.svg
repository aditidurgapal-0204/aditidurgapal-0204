      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="52%" stop-color="#172554" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
