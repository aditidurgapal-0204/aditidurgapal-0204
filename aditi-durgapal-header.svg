<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Aditi Durgapal</title>
  <desc id="desc">Computer Science Student and AI Technology Enthusiast</desc>
  <defs>
